services:

  antora:
    image: antora-openehr:latest
    container_name: antora-openehr-builder
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
      # Cache npm and git to speed up builds
      - npm-cache:/home/node/.npm
      - git-cache:/home/node/.cache/git
    working_dir: /workspace
    user: "1000:1000"
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
    command: tail -f /dev/null  # Keep container running for interactive use


  nginx:
    image: nginx:alpine
    container_name: antora-openehr-nginx
    profiles:
      - test
    ports:
      - "8081:80"
    volumes:
      - ./build:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/legacy-redirects.conf:/etc/nginx/legacy-redirects.conf:ro

volumes:
  npm-cache:
  git-cache:
